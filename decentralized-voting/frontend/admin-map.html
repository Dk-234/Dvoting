<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Location Admin Map</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <style>
        :root {
            --bg: #f2f5f9;
            --panel: #ffffff;
            --text: #0b1f3a;
            --muted: #5c6f85;
            --accent: #1d6fd8;
            --border: #d8e1eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #ffffff 0%, var(--bg) 55%, #e8eef6 100%);
            color: var(--text);
        }

        .page {
            width: min(1200px, 96vw);
            margin: 20px auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 18px 40px rgba(11, 31, 58, 0.1);
        }

        .header {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .title {
            margin: 0;
            font-size: 1.35rem;
        }

        .meta {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn:hover {
            filter: brightness(0.95);
        }

        .status {
            color: var(--muted);
            font-size: 0.9rem;
        }

        #map {
            height: 68vh;
            min-height: 420px;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .popup {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .popup b {
            color: #102f5a;
        }

        @media (max-width: 700px) {
            .page {
                margin: 10px auto;
                padding: 12px;
            }

            #map {
                height: 62vh;
                min-height: 360px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="header">
            <div>
                <h1 class="title">Recent Vote Locations</h1>
                <p class="meta">Shows the latest vote submissions with optional geocoded city/country.</p>
            </div>
            <div class="controls">
                <button id="refreshBtn" class="btn" type="button">Refresh</button>
                <span id="status" class="status">Loading...</span>
            </div>
        </div>

        <div id="map"></div>
    </main>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script>
        const API_URL = window.location.origin || 'http://localhost:3001';
        const statusEl = document.getElementById('status');
        const map = L.map('map').setView([20, 0], 2);
        let markerLayer = L.layerGroup().addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function truncateAddress(address) {
            if (!address || typeof address !== 'string') return 'N/A';
            return `${address.slice(0, 8)}...${address.slice(-6)}`;
        }

        function formatPopup(location) {
            const ts = location.timestamp ? new Date(location.timestamp).toLocaleString() : 'N/A';
            const lat = location.latitude !== null && location.latitude !== undefined ? Number(location.latitude).toFixed(5) : 'N/A';
            const lng = location.longitude !== null && location.longitude !== undefined ? Number(location.longitude).toFixed(5) : 'N/A';
            const text = location.location_text || 'No reverse-geocoded label';

            return `
                <div class="popup">
                    <b>Voter:</b> ${truncateAddress(location.voter_address)}<br>
                    <b>Proposal:</b> ${location.proposal_id}<br>
                    <b>Tx:</b> ${truncateAddress(location.tx_hash)}<br>
                    <b>Time:</b> ${ts}<br>
                    <b>Location:</b> ${text}<br>
                    <b>Lat/Lng:</b> ${lat}, ${lng}
                </div>
            `;
        }

        async function loadMarkers() {
            statusEl.textContent = 'Loading latest vote locations...';
            markerLayer.clearLayers();

            try {
                const response = await fetch(`${API_URL}/api/locations?limit=200`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const locations = await response.json();
                const bounds = [];
                let plotted = 0;

                locations.forEach((location) => {
                    const lat = Number(location.latitude);
                    const lng = Number(location.longitude);
                    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

                    const marker = L.marker([lat, lng]).addTo(markerLayer);
                    marker.bindPopup(formatPopup(location));
                    bounds.push([lat, lng]);
                    plotted += 1;
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [28, 28], maxZoom: 12 });
                }

                statusEl.textContent = `Loaded ${locations.length} records, plotted ${plotted} markers.`;
            } catch (error) {
                console.error('Failed to load locations:', error);
                statusEl.textContent = 'Failed to load location data.';
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadMarkers);
        loadMarkers();
    </script>
</body>
</html>
